<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body { margin:0; padding:0; background-color:#000; overflow:hidden; width:100%; height:100%; }
    #player { position:fixed; top:0; left:0; width:100%; height:100%; }
    iframe { width:100% !important; height:100% !important; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    var videoId = getParam('id') || 'DEFAULT_VIDEO_ID';
    var player;
    var startedReported = false;
    var bridge = null;
    var readyWatchdog = null;

    function setupBridge(callback) {
      if (window.AndroidBridge) {
        callback(window.AndroidBridge);
        return;
      }
      if (window.AndroidInterface) {
        callback(window.AndroidInterface);
        return;
      }
      callback(null);
    }

    setupBridge(function(b) {
      bridge = b;
      readyWatchdog = setTimeout(function () {
        if (!startedReported && bridge) {
          if (bridge.onYoutubeError) bridge.onYoutubeError(-1);
          else if (bridge.onError) bridge.onError(-1);
        }
      }, 15000);
    });

    function getOrigin() {
      if (window.location.origin && window.location.origin !== "null" && window.location.origin.startsWith("http")) {
        return window.location.origin;
      }
      return "https://bcs24admin.org.bd";
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 0,
          playsinline: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          enablejsapi: 1,
          origin: getOrigin()
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      try {
        var levels = event.target.getAvailableQualityLevels();
        var safeTiersHighToLow = ['hd1080', 'hd720', 'large', 'medium', 'small'];
        for (var i = 0; i < safeTiersHighToLow.length; i++) {
          if (levels.indexOf(safeTiersHighToLow[i]) !== -1) {
            event.target.setPlaybackQuality(safeTiersHighToLow[i]);
            break;
          }
        }
      } catch (e) {}

      try {
        event.target.playVideo();
      } catch (e) {}

      setTimeout(function() {
        if (!startedReported && player) {
          try {
            var state = player.getPlayerState();
            if (state !== 1 && state !== 3) {
              player.mute();
              player.playVideo();
            }
          } catch(e) {}
        }
      }, 2500);
    }

    function onPlayerError(event) {
      if (readyWatchdog) { clearTimeout(readyWatchdog); readyWatchdog = null; }
      if (bridge) {
        if (bridge.onYoutubeError) bridge.onYoutubeError(event.data);
        else if (bridge.onError) bridge.onError(event.data);
      }
    }

    function onPlayerStateChange(event) {
      if ((event.data === 1 || event.data === 3) && !startedReported) {
        startedReported = true;
        if (readyWatchdog) { clearTimeout(readyWatchdog); readyWatchdog = null; }
        if (bridge) {
          if (bridge.onYoutubeStarted) bridge.onYoutubeStarted();
          else if (bridge.onPlaying) bridge.onPlaying();
        }
      }
    }
  </script>
</body>
</html>
