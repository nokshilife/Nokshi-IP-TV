<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body { margin:0; padding:0; background-color:#000; overflow:hidden; width:100%; height:100%; }
    #player { position:fixed; top:0; left:0; width:100%; height:100%; }
    iframe { width:100% !important; height:100% !important; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    var videoId = getParam('id');
    var player;
    var startedReported = false;
    var bridge = null;
    var readyWatchdog = null;

    function setupBridge(callback) {
      if (window.AndroidBridge) {
        callback(window.AndroidBridge);
        return;
      }
      if (window.qt && qt.webChannelTransport) {
        var script = document.createElement('script');
        script.src = 'qrc:///qtwebchannel/qwebchannel.js';
        script.onload = function() {
          new QWebChannel(qt.webChannelTransport, function(channel) {
            callback(channel.objects.bridge);
          });
        };
        document.head.appendChild(script);
        return;
      }
      callback(null);
    }
    setupBridge(function(b) {
      bridge = b;
      // ব্রিজ রেডি হওয়ার পর ১৫ সেকেন্ডের মধ্যে প্লেয়ার সত্যিই "PLAYING" স্টেটে না গেলে
      // (নেটওয়ার্ক সমস্যা, iframe_api লোড ব্যর্থতা, বা অন্য কোনো সাইলেন্ট আটকে যাওয়া) এটা
      // Android-কে জানিয়ে দেবে — তাহলে অ্যাপ কালো স্ক্রিনে চিরকাল আটকে না থেকে স্বয়ংক্রিয়ভাবে
      // পরের চ্যানেলে চলে যেতে পারবে।
      readyWatchdog = setTimeout(function () {
        if (!startedReported && bridge && bridge.onYoutubeError) {
          bridge.onYoutubeError(-1); // কাস্টম কোড: টাইমআউট (YouTube-এর অফিসিয়াল কোড নয়)
        }
      }, 15000);
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1, mute: 0, playsinline: 1, rel: 0, modestbranding: 1,
          controls: 0, showinfo: 0, iv_load_policy: 3, fs: 0, disablekb: 1,
          enablejsapi: 1, origin: window.location.origin
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      try {
        // সর্বোচ্চ কোয়ালিটি বিনা শর্তে জোর না করে একটা নিরাপদ "ছাদ" (১০৮০p) রাখা হচ্ছে —
        // এর উপরের টায়ার (1440p/4K) অনেক কম-শক্তিশালী Android TV বক্সে ভিডিও রেন্ডারার
        // ক্র্যাশের একটা বড় কারণ হতে পারে। YouTube নিজেও এখন quality-forcing API ডেপ্রিকেট
        // করে দিয়েছে — এটা শুধু একটা হিন্ট, তাদের adaptive অ্যালগরিদমই মূল নিয়ন্ত্রক।
        var levels = event.target.getAvailableQualityLevels();
        var safeTiersHighToLow = ['hd1080', 'hd720', 'large', 'medium', 'small'];
        var chosen = null;
        for (var i = 0; i < safeTiersHighToLow.length; i++) {
          if (levels.indexOf(safeTiersHighToLow[i]) !== -1) {
            chosen = safeTiersHighToLow[i];
            break;
          }
        }
        if (chosen) {
          event.target.setPlaybackQuality(chosen);
        } else if (levels && levels.length > 0) {
          event.target.setPlaybackQuality(levels[0]);
        }
      } catch (e) {}
      event.target.playVideo();
    }

    function onPlayerError(event) {
      if (readyWatchdog) { clearTimeout(readyWatchdog); readyWatchdog = null; }
      if (bridge && bridge.onYoutubeError) bridge.onYoutubeError(event.data);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING && !startedReported) {
        startedReported = true;
        if (readyWatchdog) { clearTimeout(readyWatchdog); readyWatchdog = null; }
        if (bridge && bridge.onYoutubeStarted) bridge.onYoutubeStarted();
      }
    }
  </script>
</body>
</html>
